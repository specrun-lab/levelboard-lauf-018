# Levelboard – nginx-Konfiguration (lokal, ohne root) mit Weiterleitung /api/ an das Backend
# Gestartet mit: nginx -p "<projektordner>/" -e .run/nginx-error.log -c frontend/nginx-api.conf

pid .run/nginx.pid;
error_log .run/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/svg+xml                         svg;
        image/png                             png;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css application/javascript application/json;

    access_log .run/nginx-access.log;

    client_body_temp_path .run/nginx-tmp/client;
    proxy_temp_path .run/nginx-tmp/proxy;
    fastcgi_temp_path .run/nginx-tmp/fastcgi;
    uwsgi_temp_path .run/nginx-tmp/uwsgi;
    scgi_temp_path .run/nginx-tmp/scgi;

    server_tokens off;

    server {
        listen 127.0.0.1:8080;
        root frontend/dist;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types text/css application/javascript application/json;

        location = / {
            add_header Cache-Control "no-cache" always;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        location = /results.json {
            add_header Cache-Control "no-store" always;
        }
        location = /config.json {
            add_header Cache-Control "no-store" always;
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            charset off;
            add_header Cache-Control "no-store" always;
        }
    }
}
