name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/specrun-lab/devcontainer:1
      options: --user root
    env:
      GOMODCACHE: /home/dev/go/pkg/mod
      GOCACHE: /home/dev/.cache/go-build
      GOFLAGS: -modcacherw -buildvcs=false
    steps:
      - uses: actions/checkout@v7
      - name: Level 5 starten
        run: make level5
      - name: Prüfen
        run: make check
      - name: Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levelboard-report
          path: |
            frontend/dist/results.json
            checks/.out/playwright.json

  images:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Images bauen
        run: docker compose build
      - name: Container starten
        run: docker compose up -d --wait
      - name: Container-Suite
        run: |
          cd checks
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/container.spec.ts
      - name: Container-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: levelboard-container-report
          path: checks/.out/playwright.json
      - name: In die GHCR pushen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose push
          docker tag "$IMAGE_PREFIX-backend:$IMAGE_TAG" "$IMAGE_PREFIX-backend:main"
          docker tag "$IMAGE_PREFIX-frontend:$IMAGE_TAG" "$IMAGE_PREFIX-frontend:main"
          docker push "$IMAGE_PREFIX-backend:main"
          docker push "$IMAGE_PREFIX-frontend:main"
      - name: Aufräumen
        if: always()
        run: docker compose down -v

  deploy:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - name: Lauf-Kennung festlegen
        run: |
          RUN_ID="${{ github.event.repository.name }}"
          RUN_ID="${RUN_ID#levelboard-}"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          if [ -z "${{ vars.LIVE_DOMAIN }}" ]; then
            echo "LIVE_DOMAIN fehlt" >&2
            exit 1
          fi
          echo "LIVE_URL=https://$RUN_ID.${{ vars.LIVE_DOMAIN }}" >> "$GITHUB_ENV"
      - name: SSH-Zugang vorbereiten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Ordner anlegen und Dateien übertragen
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ~/runs/$RUN_ID"
          scp -o StrictHostKeyChecking=yes deploy/compose.yml "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/runs/$RUN_ID/compose.yml"
          printf 'RUN_ID=%s\nIMAGE_PREFIX=%s\nIMAGE_TAG=%s\n' "$RUN_ID" "$IMAGE_PREFIX" "$IMAGE_TAG" > .env
          scp -o StrictHostKeyChecking=yes .env "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/runs/$RUN_ID/.env"
      - name: Container starten
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd ~/runs/$RUN_ID && docker compose pull -q && docker compose up -d --wait --remove-orphans"
      - name: Auf Live-Adresse warten
        run: |
          for i in $(seq 1 180); do
            if curl -sf "$LIVE_URL/api/health" | grep -q "\"commit\":\"$IMAGE_TAG\""; then
              echo "Live-Seite meldet Commit $IMAGE_TAG"
              exit 0
            fi
            sleep 1
          done
          echo "Live-Seite wurde nicht rechtzeitig erreichbar" >&2
          exit 1
      - name: Report laden
        uses: actions/download-artifact@v8
        with:
          name: levelboard-report
      - name: An die Live-API melden
        run: node checks/report-live.mjs frontend/dist/results.json "$LIVE_URL"
      - name: Live-Seite prüfen
        run: |
          curl -sf "$LIVE_URL/" -o /dev/null
          curl -sf "$LIVE_URL/config.json" | grep -q '"api"'
